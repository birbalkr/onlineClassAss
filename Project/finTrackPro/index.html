<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>

<body>

    <div class="flex h-screen">

        <div class="left bg-red w-[16%] items-center gap-2 p-4 border-r-2 border-gray-400">
            <div class="flex">
                <i class="fa-solid fa-layer-group fa-2x"></i>
                <div>
                    <h1 class="text-xl font-bold">FinTrack Pro</h1>
                    <span class="text-[12px]    ">Enterprise Finance</span>
                </div>
            </div>

            <div class="flex flex-col justify-between h-[90%] mt-4">
                <div class="flex flex-col">
                    <div class="flex items-center gap-2 bg-white text-black p-2 rounded-md">
                        <i class="fa-solid fa-border-all"></i>
                        <div>Dashboard</div>
                    </div>

                    <div class="flex items-center gap-2 bg-white text-black p-2 rounded-md">
                        <i class="fa-solid fa-gear"></i>
                        <div>Settings</div>
                    </div>
                </div>

                <div
                    class="flex justify-center items-center gap-2 bg-black text-white p-2 rounded-md mt-4 cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <div>
                        Add Transaction
                    </div>
                </div>
            </div>
        </div>
        <div class="right bg-white w-[84%]">

            <nav class="flex gap-4 justify-end items-center p-4 border-b-2 border-gray-400">
                <hr>
                <div>name</div>
                <div>
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </div>
            </nav>

            <section class="p-6">

                <div class="flex flex-col gap-2 mt-4">
                    <span class="text-3xl font-bold">Financial Overview</span>
                    <span class="text-sm">Real-time tracking application</span>
                </div>

                <!-- card  -->
                <div class="grid grid-cols-4 gap-4 mt-4">

                    <div class="border-2 p-4 gap-2 flex flex-col rounded-xl">
                        <div class="w-10 h-10 bg-blue-100 text-blue-900 justify-center flex items-center rounded-xl"><i
                                class="fa-solid fa-building-columns "></i></div>
                        <div class="text-sm">Current Balance</div>
                        <div class="text-2xl text-blue-900 font-bold"><span>$</span>0.00</div>
                    </div>

                    <div class="border-2 p-4 gap-2 flex flex-col rounded-xl">
                        <div class="w-10 h-10 bg-green-100 text-green-900  justify-center flex items-center rounded-xl">
                            <i class="fa-solid fa-arrow-trend-up"></i>
                        </div>
                        <div class="text-sm">Total Income</div>
                        <div class="text-2xl text-green-900 font-bold"><span>$</span>0.00</div>
                    </div>

                    <div class="border-2 p-4 gap-2 flex flex-col rounded-xl">
                        <div class="w-10 h-10 bg-rose-100 text-rose-900  justify-center flex items-center rounded-xl"><i
                                class="fa-solid fa-arrow-trend-down"></i></div>
                        <div class="text-sm">Total Expense</div>
                        <div class="text-2xl text-rose-900 font-bold"><span>$</span>0.00</div>
                    </div>

                    <div class="border-2 p-4 gap-2 flex flex-col rounded-xl">
                        <div class="w-10 h-10 bg-blue-100 text-blue-900 justify-center flex items-center rounded-xl"><i
                                class="fa-solid fa-piggy-bank"></i></div>
                        <div class="text-sm">Total Transactions</div>
                        <div class="text-2xl text-blue-900 font-bold"><span>$</span>0.00</div>
                    </div>

                </div>

                <div class="mt-4 flex gap-4 w-full">
                    <div class="border-2 p-4 gap-2 flex flex-col rounded-xl w-[60%]">
                        <div class="text-2xl font-bold">Cash Flow Analysis</div>
                        <div class="">
                            <canvas id="myChart"></canvas>
                        </div>
                    </div>

                    <div>
                        <div>Preferences</div>
                        <div class="flex gap-2 items-center mt-4 justify-between">
                            <div>Dark Mode</div>
                            <div>
                                <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider round"></span>
                            </label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
