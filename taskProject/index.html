<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <!-- FIX 1: viewport was missing values -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>DOM Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 min-h-screen transition-colors duration-300">


    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-semibold text-gray-800">
            ✅ DOM Task Manager
        </h1>
        <button id="theme-btn"
            class="flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-600 hover:bg-gray-100 transition">
            🌙 <span id="theme-label">Dark Mode</span>
        </button>
    </header>

    <main class="flex justify-center px-4 py-10">
        <div class="w-full max-w-2xl">


            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl border border-gray-200 p-4 text-center shadow-sm">
                    <div id="total-count" class="text-3xl font-semibold text-gray-800">0</div>
                    <div class="text-sm text-gray-500 mt-1">Total Tasks</div>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-4 text-center shadow-sm">
                    <div id="done-count" class="text-3xl font-semibold text-green-600">0</div>
                    <div class="text-sm text-gray-500 mt-1">Completed</div>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-4 text-center shadow-sm">
                    <div id="pending-count" class="text-3xl font-semibold text-yellow-500">0</div>
                    <div class="text-sm text-gray-500 mt-1">Pending</div>
                </div>
            </div>


            <div class="bg-white rounded-xl border border-gray-200 p-5 mb-4 shadow-sm">
                <p class="text-sm font-medium text-gray-500 mb-3"><img src="image/plus.png" alt=""> Add New Task</p>
                <div class="flex gap-3">

                    <input type="text" id="task-input" placeholder="Task title..." value=""
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />

                    <select id="cat-select"
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>


                    <button onclick="addTask()"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                        + Add
                    </button>
                </div>
            </div>


            <div class="flex gap-3 mb-4">
                <input type="text" id="search-input" placeholder="🔍 Search tasks..." oninput="filterTasks()"
                    class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                <select id="filter-cat" onchange="filterTasks()"
                    class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="all">All Categories</option>
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="health">Health</option>
                    <option value="other">Other</option>
                </select>
            </div>


            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-sm font-medium text-gray-500">Tasks</span>
                <button onclick="clearAll()" class="text-xs text-red-400 hover:text-red-600 transition">
                    🗑 Clear All
                </button>
            </div>
            <div id="task-list" class="space-y-3">
                <div id="empty-msg"
                    class="bg-white rounded-xl border border-dashed border-gray-300 p-8 text-center text-gray-400 text-sm">
                    No tasks yet. Add one above!
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
